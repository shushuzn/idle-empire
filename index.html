<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>放置帝国 · Idle Empire</title>
  <meta name="description" content="一个纯前端的放置/增量游戏：建筑、升级、Boss、成就、转生与剧情档案。存档保存在本地浏览器。" />
  <meta name="theme-color" content="#0b0f18" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
    // 在样式表加载前定好主题，避免浅色模式刷新时闪一下黑屏
    (function () {
      try {
        var pref = localStorage.getItem('idle_empire_theme');
        if (pref !== 'light' && pref !== 'dark') pref = 'auto';
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = pref === 'auto' ? (light ? 'light' : 'dark') : pref;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePref = pref;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f4f2ec' : '#0b0f18';
      } catch (e) { /* 隐私模式下 localStorage 可能报错 */ }
    })();
  </script>
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="hud-top">
        <h1 class="brand"><span class="brand-ico" data-icon="castle" data-tone="1" aria-hidden="true"></span> 放置帝国</h1>
        <button id="settings-btn" class="icon-btn" aria-label="设置" data-icon="gear"></button>
      </div>
      <div class="resources">
        <div class="res gold">
          <b id="gold">0</b>
          <span class="res-label"><span class="res-ico" data-icon="coin" data-tone="1" aria-hidden="true"></span>金币</span>
        </div>
        <div class="res">
          <b id="gps">+0/秒</b>
          <span class="res-label"><span class="res-ico" data-icon="bolt" data-tone="2" aria-hidden="true"></span>产能</span>
        </div>
        <div class="res shards">
          <b id="shards">0</b>
          <span class="res-label"><span class="res-ico" data-icon="shard" data-tone="3" aria-hidden="true"></span>碎片</span>
        </div>
      </div>
    </header>

    <button id="tap" class="tap" aria-label="点击挖矿">
      <span class="tap-ico" data-icon="mine" aria-hidden="true"></span>
      <span class="tap-txt">点击 +<b id="tap-gain">1</b></span>
    </button>

    <main id="view" class="view" role="tabpanel" aria-label="建筑" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" role="tablist" aria-label="主导航"></nav>
  </div>

  <div id="floaters" class="floaters" aria-hidden="true"></div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <dialog id="welcome" class="welcome" aria-labelledby="w-title" aria-describedby="w-time w-rate">
    <div class="welcome-inner">
      <div class="welcome-ico" data-icon="moon" data-tone="3" aria-hidden="true"></div>
      <h2 id="w-title">离线收益</h2>
      <p id="w-time" class="w-time"></p>
      <div class="w-gain">
        <b id="w-gold">0</b>
        <span>金币</span>
      </div>
      <p id="w-rate" class="note"></p>
      <button id="w-ok" class="primary" type="button">收下</button>
    </div>
  </dialog>

  <dialog id="settings" class="settings" aria-labelledby="s-title">
    <form method="dialog" class="settings-inner">
      <header class="settings-head">
        <h2 id="s-title">设置</h2>
        <button id="s-close" class="icon-btn" value="close" aria-label="关闭" data-icon="close"></button>
      </header>

      <section class="stats-grid">
        <div><span>当前金币</span><b id="s-gold">0</b></div>
        <div><span>本轮收益</span><b id="s-total">0</b></div>
        <div><span>累计收益</span><b id="s-life">0</b></div>
        <div><span>点击次数</span><b id="s-clicks">0</b></div>
        <div><span>建筑总数</span><b id="s-buildings">0</b></div>
        <div><span>Boss 击杀</span><b id="s-kills">0</b></div>
        <div><span>转生次数</span><b id="s-rebirths">0</b></div>
        <div><span>碎片</span><b id="s-shards">0</b></div>
        <div><span>成就</span><b id="s-ach">0 / 0</b></div>
        <div><span>剧情档案</span><b id="s-story">0 / 0</b></div>
        <div><span>游戏时长</span><b id="s-playtime">0</b></div>
      </section>

      <div class="pref">
        <div class="pref-title" id="pref-theme-label">主题</div>
        <div class="theme-picker" role="radiogroup" aria-labelledby="pref-theme-label">
          <label><input type="radio" name="theme-pref" value="auto" /><span>跟随系统</span></label>
          <label><input type="radio" name="theme-pref" value="light" /><span>浅色</span></label>
          <label><input type="radio" name="theme-pref" value="dark" /><span>深色</span></label>
        </div>
      </div>
      <label class="switch">
        <span>点击振动</span>
        <input id="s-vibrate" type="checkbox" checked />
      </label>

      <div class="pref install-block" id="install-block" hidden>
        <div class="pref-title">安装到桌面</div>
        <p class="note" id="install-note"></p>
        <button id="s-install" class="ghost" type="button" hidden>添加到主屏幕</button>
      </div>

      <p id="s-status" class="settings-status" role="status" aria-live="polite"></p>

      <div class="settings-actions">
        <button id="s-save" class="ghost" type="button">立即存档</button>
        <button id="s-export" class="ghost" type="button">导出存档</button>
        <button id="s-import" class="ghost" type="button">导入存档</button>
        <button id="s-reset" class="danger" type="button">重置进度</button>
      </div>

      <p class="note">进度存在本机 localStorage，换设备或清浏览器数据会丢。「导出存档」会下载一个 JSON 文件，换设备后用「导入存档」选它即可。</p>
      <p class="about">放置帝国 v3.7.0 · <a href="https://github.com/shushuzn/idle-empire" target="_blank" rel="noopener noreferrer">MIT 许可与源码</a></p>
    </form>
  </dialog>

  <input id="save-file" type="file" accept=".json,.txt,.save,application/json,text/plain" hidden />

  <noscript>
    <p style="padding: 24px; font-family: system-ui, sans-serif">这个游戏需要开启 JavaScript 才能玩。</p>
  </noscript>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
